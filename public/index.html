<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <title>UniTalk</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="face">
    <main class="stage">
      <!-- Orang B: di HP diputar 180° supaya menghadap lawan bicara -->
      <section class="half" data-side="b">
        <div class="half__top">
          <label class="lang">
            <select data-t-label="language"></select>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </label>
        </div>
        <p class="greet" aria-hidden="true"></p>
        <div class="feed" aria-live="polite"></div>
        <div class="half__foot">
          <button class="mic" type="button" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0" /><path d="M12 17.5V21" /></svg>
          </button>
          <p class="hint"></p>
        </div>
      </section>

      <nav class="divider">
        <span class="brand">UniTalk</span>
        <button class="icon-btn" id="swap" type="button" data-t-label="swap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4" /><path d="M3 8h14" /><path d="m17 20 4-4-4-4" /><path d="M21 16H7" /></svg>
        </button>
        <button class="icon-btn" id="openSettings" type="button" data-t-label="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10" /><path d="M18 7h2" /><circle cx="16" cy="7" r="2" /><path d="M4 17h2" /><path d="M10 17h10" /><circle cx="8" cy="17" r="2" /></svg>
        </button>
      </nav>

      <!-- Orang A -->
      <section class="half" data-side="a">
        <div class="half__top">
          <label class="lang">
            <select data-t-label="language"></select>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </label>
        </div>
        <p class="greet" aria-hidden="true"></p>
        <div class="feed" aria-live="polite"></div>
        <div class="half__foot">
          <button class="mic" type="button" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0" /><path d="M12 17.5V21" /></svg>
          </button>
          <p class="hint"></p>
        </div>
      </section>
    </main>

    <div class="loader" id="loader" role="status">
      <div class="loader__box">
        <p class="wordmark">UniTalk</p>
        <p class="loader__text" id="loaderText"></p>
        <div class="bar"><span id="loaderBar"></span></div>
        <p class="loader__sub" id="loaderSub"></p>
        <button class="btn" id="retry" type="button" data-t="retry" hidden></button>
      </div>
    </div>

    <dialog class="sheet" id="settings">
      <form method="dialog">
        <div class="sheet__head">
          <h2 data-t="settings"></h2>
          <button class="icon-btn" value="close" data-t-label="close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12" /><path d="M18 6 6 18" /></svg>
          </button>
        </div>

        <label class="setting">
          <span data-t="readAloud"></span>
          <input class="switch" type="checkbox" role="switch" id="autoSpeak" />
        </label>
        <p class="setting__note" id="voiceNote" hidden></p>

        <div class="setting setting--stack">
          <span data-t="recognition"></span>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="quality" value="fast" /><span data-t="fast"></span></label>
            <label><input type="radio" name="quality" value="balanced" /><span data-t="balanced"></span></label>
            <label><input type="radio" name="quality" value="accurate" /><span data-t="accurate"></span></label>
          </div>
          <p class="setting__note" data-t="privacy"></p>
        </div>

        <label class="setting only-narrow">
          <span data-t="faceToFace"></span>
          <input class="switch" type="checkbox" role="switch" id="faceToFace" />
        </label>

        <label class="setting">
          <span data-t="evalMode"></span>
          <input class="switch" type="checkbox" role="switch" id="evalMode" />
        </label>

        <div class="eval" id="evalTools" hidden>
          <p class="eval__stats" id="stats"></p>
          <button class="btn" id="exportLog" type="button" data-t="exportLog"></button>

          <p class="eval__label" data-t="testAudio"></p>
          <div class="eval__row">
            <input type="file" id="testFile" accept="audio/*" />
            <select class="side-select" id="testSide"></select>
            <button class="btn" id="runTest" type="button" data-t="run"></button>
          </div>

          <p class="eval__label" data-t="typeTest"></p>
          <div class="eval__row">
            <input class="field" type="text" id="typeInput" autocomplete="off" />
            <select class="side-select" id="typeSide"></select>
            <button class="btn" id="typeSend" type="button" data-t="send"></button>
          </div>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
